version: '3.8'

services:
  incidentpulse-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incidentpulse-warroom
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SIMULATOR_METRICS_INTERVAL_MS=1000
      - SIMULATOR_LOG_INTERVAL_MS=700
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
